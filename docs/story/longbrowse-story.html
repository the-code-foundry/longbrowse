<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>longbrowse — the story</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --dim:#8b949e;
    --teal:#2dd4bf; --red:#f85149; --green:#3fb950; --amber:#d29922; --blue:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;min-height:100vh}
  header{padding:22px 20px 6px;text-align:center}
  header h1{margin:0;font-size:26px;letter-spacing:.5px}
  header h1 b{color:var(--teal)}
  header p{margin:4px 0 0;color:var(--dim);font-size:14px}

  #stage{position:relative;width:960px;max-width:96vw;height:480px;background:var(--panel);
         border:1px solid var(--line);border-radius:14px;margin:18px 0 10px;overflow:hidden}
  .scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s}
  .scene.on{opacity:1;pointer-events:auto}

  .actor{position:absolute;text-align:center;transition:all .8s ease}
  .actor .emoji{font-size:52px;display:block}
  .actor .tag{font-size:12px;color:var(--dim)}

  .box{position:absolute;border:1px solid var(--line);border-radius:10px;background:#0d1117;
       padding:10px 14px;font-size:13px;transition:all .8s ease}
  .box h4{margin:0 0 6px;font-size:13px;color:var(--teal);font-weight:600}

  /* chaos calls: scene 1 */
  .call{position:absolute;font:12px ui-monospace,monospace;color:var(--red);opacity:0;
        white-space:nowrap;animation:flyfail 2.6s linear infinite}
  .call.ok{color:var(--amber);animation-name:fly}
  @keyframes fly{0%{opacity:0;transform:translateX(0)}12%{opacity:1}80%{opacity:1}
                 100%{opacity:0;transform:translateX(430px)}}
  @keyframes flyfail{0%{opacity:0;transform:translateX(0)}12%{opacity:1}55%{opacity:1;transform:translateX(300px)}
                 62%{transform:translateX(290px) rotate(-6deg)}
                 100%{opacity:0;transform:translateX(300px) translateY(60px) rotate(-18deg)}}
  .sweat{position:absolute;font-size:22px;animation:drip 1.4s ease-in infinite;opacity:0}
  @keyframes drip{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(26px)}}

  /* longbrowse container: scenes 2+ */
  .lb{position:absolute;border:2px solid var(--teal);border-radius:14px;background:#0f1a1e;
      transition:all .9s ease;box-shadow:0 0 24px #2dd4bf33}
  .lb .lbtitle{position:absolute;top:-12px;left:16px;background:var(--bg);color:var(--teal);
      padding:0 8px;font-size:13px;font-weight:700}
  .slot{position:absolute;border:1px dashed var(--line);border-radius:8px;color:var(--dim);
        font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .6s}

  /* log list: scene 3 */
  .log{position:absolute;font:12px/1.9 ui-monospace,monospace;color:var(--dim)}
  .log div{transition:all .4s;padding:0 8px;border-radius:5px}
  .log div.sel{background:#1f3b33;color:var(--teal)}
  .fnchip{position:absolute;background:#1f3b33;border:1px solid var(--teal);color:var(--teal);
          border-radius:8px;padding:8px 14px;font:13px ui-monospace,monospace;opacity:0;
          transition:all .8s ease}

  /* race: scene 4 */
  .lane{position:absolute;left:40px;right:40px;height:120px;border:1px solid var(--line);
        border-radius:10px;padding:10px 14px}
  .lane h4{margin:0;font-size:13px;color:var(--dim)}
  .tick{display:inline-block;font:11px ui-monospace,monospace;color:var(--amber);
        margin-right:6px;opacity:0}
  .tick.show{animation:pop .3s forwards}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  .one{font:14px ui-monospace,monospace;color:var(--green);opacity:0;transition:opacity .5s}
  .one.show{opacity:1}

  .bubble{position:absolute;background:#0d1117;border:1px solid var(--line);border-radius:10px;
          padding:8px 12px;font-size:13px;opacity:0;transition:all .6s}
  .bubble.show{opacity:1}
  .big{font-size:40px}

  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 10px #2dd4bf33}50%{box-shadow:0 0 34px #2dd4bf66}}

  /* captions + controls */
  #caption{width:960px;max-width:96vw;min-height:84px;background:var(--panel);
           border:1px solid var(--line);border-radius:10px;padding:12px 16px}
  #caption b{color:var(--teal)}
  #caption p{margin:4px 0 0;color:var(--dim);font-size:14px}
  #controls{display:flex;gap:10px;align-items:center;margin:14px 0 30px}
  button{background:#21262d;color:var(--txt);border:1px solid var(--line);border-radius:8px;
         padding:6px 16px;cursor:pointer;font-size:14px}
  button:hover{background:#30363d}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--line);cursor:pointer;transition:background .3s}
  .dot.on{background:var(--teal)}
  code{background:#161b22;border:1px solid var(--line);border-radius:4px;padding:0 5px;
       font-size:12px;color:var(--blue)}
</style>
</head>
<body>

<header>
  <h1><b>longbrowse</b> — from 30 fragile calls to one happy API</h1>
  <p>storyboard · each scene is one step of the idea</p>
</header>

<div id="stage"></div>

<div id="caption"><b></b><p></p></div>

<div id="controls">
  <button id="prev">‹ Prev</button>
  <button id="play">⏸ Pause</button>
  <button id="next">Next ›</button>
  <span id="dots" style="display:flex;gap:7px;margin-left:10px"></span>
</div>

<script>
const scenes = [
{
  title: '1 · The problem: an AI vs a website',
  text: 'The agent needs ONE piece of information from a site built for humans. No API. So it fires dozens of raw browser calls — navigate, snapshot, click, type, snapshot again… selectors break, sessions expire, every answer costs a full page of context.',
  html: `
    <div class="actor" style="left:70px;top:160px"><span class="emoji">🤖</span><span class="tag">AI agent</span></div>
    <div class="sweat" style="left:150px;top:150px">💧</div>
    <div class="actor" style="right:80px;top:160px"><span class="emoji">🌐</span><span class="tag">the website</span></div>
    ${[
      ['navigate /login',0],['snapshot (14 kB)',.3,1],['click #cookie-ok',.6],['type user…',.9,1],
      ['snapshot (18 kB)',1.2],['click .menu > li:nth(4)',1.5],['ERR: selector not found',1.8],
      ['snapshot again…',2.1,1],['click retry',2.4],['session expired ↻',2.7]
    ].map(([t,d,ok],i)=>`<div class="call ${ok?'ok':''}" style="left:170px;top:${70+i*36}px;animation-delay:${d}s">${t} →</div>`).join('')}
  `,
},
{
  title: '2 · The idea: put the site inside longbrowse',
  text: 'Drag in longbrowse: one container with a real headful Chromium (viewable over noVNC), an MCP + REST server in front, and an empty plugins folder. The site now lives INSIDE something you control — logins persist in profiles, every tool call is recorded.',
  html: `
    <div class="lb pulse" style="left:280px;top:80px;width:400px;height:320px">
      <span class="lbtitle">longbrowse</span>
      <div class="actor" style="left:160px;top:90px"><span class="emoji">🌐</span><span class="tag">site (real Chromium)</span></div>
      <div class="slot" style="left:20px;bottom:18px;width:170px;height:54px">plugins/ (empty)</div>
      <div class="slot" style="right:20px;bottom:18px;width:170px;height:54px">MCP · REST · noVNC</div>
    </div>
    <div class="actor" style="left:80px;top:170px"><span class="emoji">🤖</span><span class="tag">AI agent</span></div>
    <div class="bubble show" style="left:60px;top:90px">“what if the browser<br>remembered my work?”</div>
  `,
},
{
  title: '3 · Mine the history: 10 calls become one function',
  text: 'Every call the agent made is in the log. Select the chunk that found the price — 10 steps — and turn it into a plugin function. Drop the file into plugins/: longbrowse hot-reloads it, no restart, and a new tool appears: get_price {sku}.',
  html: `
    <div class="box" style="left:50px;top:60px;width:300px;height:360px"><h4>call history</h4>
      <div class="log" style="left:12px;top:40px" id="loglist">
        <div>09:14 navigate /catalog</div><div>09:14 click .search</div><div>09:14 type "DIN 933 M8"</div>
        <div>09:14 press Enter</div><div>09:15 snapshot</div><div>09:15 click row 3</div>
        <div>09:15 snapshot</div><div>09:15 click #details</div><div>09:15 snapshot</div>
        <div>09:15 extract .price</div>
      </div>
    </div>
    <div class="fnchip" id="fnchip" style="left:400px;top:200px">ft_get_price({sku})</div>
    <div class="lb" style="right:50px;top:60px;width:300px;height:360px">
      <span class="lbtitle">longbrowse</span>
      <div class="slot" id="plugslot" style="left:20px;bottom:18px;right:20px;height:60px">plugins/get-price/tools.js</div>
      <div class="actor" style="left:110px;top:100px"><span class="emoji">🌐</span></div>
      <div class="bubble" id="reload" style="left:30px;top:50px">hot reload ✓ new tool registered</div>
    </div>
  `,
  run(el){
    const rows = el.querySelectorAll('#loglist div');
    rows.forEach((r,i)=>setTimeout(()=>r.classList.add('sel'), 400+i*180));
    setTimeout(()=>{ const c = el.querySelector('#fnchip'); c.style.opacity=1; }, 2400);
    setTimeout(()=>{ const c = el.querySelector('#fnchip'); c.style.left='620px'; c.style.top='368px'; }, 3200);
    setTimeout(()=>{ el.querySelector('#plugslot').style.borderColor='var(--teal)';
                     el.querySelector('#plugslot').style.color='var(--teal)';
                     el.querySelector('#reload').classList.add('show'); }, 4200);
  },
},
{
  title: '4 · Before / after: 10 calls vs 1 call',
  text: 'Same question, two worlds. Before: ten round-trips, four snapshots, ~60 kB of context, and it breaks when the site changes a class name. After: one REST call — POST /api/tool/ft_get_price — and the selector knowledge lives in ONE file that is fixed once, for every agent.',
  html: `
    <div class="lane" style="top:50px"><h4>before — 10 calls, ~60 kB context</h4>
      <div style="margin-top:14px" id="ticks">
        ${['navigate','click','type','press','snapshot','click','snapshot','click','snapshot','extract']
          .map(t=>`<span class="tick">${t} ✓</span>`).join('')}
      </div>
    </div>
    <div class="lane" style="top:240px;border-color:var(--green)"><h4 style="color:var(--green)">after — 1 call</h4>
      <div style="margin-top:16px">
        <span class="one" id="req">POST /api/tool/ft_get_price {"sku": "DIN933-M8"}</span><br>
        <span class="one" id="res" style="color:var(--teal)">→ {"price": 12.99, "stock": 240}   (1.8 s)</span>
      </div>
    </div>
  `,
  run(el){
    el.querySelectorAll('.tick').forEach((t,i)=>setTimeout(()=>t.classList.add('show'), 300+i*350));
    setTimeout(()=>el.querySelector('#req').classList.add('show'), 4200);
    setTimeout(()=>el.querySelector('#res').classList.add('show'), 5000);
  },
},
{
  title: '5 · Connect over MCP: the site became a happy API',
  text: 'Register the longbrowse endpoint as an MCP server (one URL, one token). The agent now sees one clean tool instead of a browser: the website has become an API — with memory, logins, hot-reloadable functions, and a window (noVNC) a human can always peek through.',
  html: `
    <div class="actor" style="left:90px;top:150px"><span class="emoji">🤖</span><span class="tag">AI agent</span></div>
    <div class="bubble show" style="left:60px;top:90px">mcp.connect("…:8931/mcp")</div>
    <div class="lb pulse" style="left:330px;top:90px;width:330px;height:300px">
      <span class="lbtitle">longbrowse</span>
      <div class="actor" style="left:125px;top:80px"><span class="emoji">🌐</span><span class="tag">site</span></div>
      <div class="slot" style="left:20px;bottom:18px;right:20px;height:48px;border-style:solid;border-color:var(--teal);color:var(--teal)">ft_get_price · ft_scrape · …</div>
    </div>
    <div class="big" id="happy" style="position:absolute;right:120px;top:170px;opacity:0;transition:all .8s">😊</div>
    <div class="bubble" id="label" style="right:70px;top:240px">happy API</div>
  `,
  run(el){
    setTimeout(()=>{ el.querySelector('#happy').style.opacity=1; }, 1200);
    setTimeout(()=>{ el.querySelector('#label').classList.add('show'); }, 1800);
  },
},
];

const stage = document.getElementById('stage');
const cap = document.getElementById('caption');
const dots = document.getElementById('dots');
let cur = 0, playing = true, timer = null;

scenes.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'scene'; d.dataset.i = i; d.innerHTML = s.html;
  stage.appendChild(d);
  const dot = document.createElement('span');
  dot.className = 'dot'; dot.onclick = () => show(i, true);
  dots.appendChild(dot);
});

function show(i) {
  cur = (i + scenes.length) % scenes.length;
  document.querySelectorAll('.scene').forEach((d) => d.classList.toggle('on', +d.dataset.i === cur));
  document.querySelectorAll('.dot').forEach((d, k) => d.classList.toggle('on', k === cur));
  cap.querySelector('b').textContent = scenes[cur].title;
  cap.querySelector('p').textContent = scenes[cur].text;
  const el = document.querySelector(`.scene[data-i="${cur}"]`);
  el.innerHTML = scenes[cur].html; // restart inline animations
  scenes[cur].run?.(el);
  schedule();
}

function schedule() {
  clearTimeout(timer);
  if (playing) timer = setTimeout(() => show(cur + 1), 9000);
}

document.getElementById('next').onclick = () => show(cur + 1);
document.getElementById('prev').onclick = () => show(cur - 1);
document.getElementById('play').onclick = (e) => {
  playing = !playing;
  e.target.textContent = playing ? '⏸ Pause' : '▶ Play';
  schedule();
};

show(0);
</script>
</body>
</html>
